name: Sandbox image

on:
  pull_request:
    paths:
      - "containers/**"
      - ".github/workflows/ci-sandbox.yml"
  push:
    branches:
      - main
    paths:
      - "containers/**"
      - ".github/workflows/ci-sandbox.yml"
  schedule:
    # Weekly full multi-chain build so toolchain bit-rot (upstream releases,
    # base-image drift) is caught even when containers/ is untouched.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build sandbox image
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker image prune --all --force

      - name: Build sandbox (EVM toolchains)
        run: |
          docker build \
            --build-arg INSTALL_EXTRA_CHAINS=0 \
            --tag strix-sandbox:ci \
            --file containers/Dockerfile \
            .

      - name: Verify EVM toolchains
        run: |
          docker run --rm strix-sandbox:ci bash -lc '
            set -euo pipefail
            forge --version
            cast --version
            slither --version
            aderyn --version
            echidna --version
            medusa --version
            python3 -c "import algokit_utils"
          '

  full:
    name: Build full multi-chain image
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          docker image prune --all --force

      - name: Build all ecosystems
        run: |
          docker build \
            --tag strix-sandbox:ci \
            --file containers/Dockerfile \
            .

      - name: Verify toolchains
        run: |
          docker run --rm strix-sandbox:ci bash -lc '
            set -euo pipefail
            forge --version
            cast --version
            anvil --version
            slither --version
            aderyn --version
            echidna --version
            medusa --version
            solana --version
            anchor --version
            sui --version
            aptos --version
            scarb --version
            snforge --version
            sncast --version
            cosmwasm-check --version
            circom --version
            circomspect --version
            nargo --version
            snarkjs --version
            tact --version
            cargo contract --version
            forc --version
            fuel-core --version
            cargo near --version
            cargo stylus --version
            algokit --version
            aiken --version
            bitcoind --version
            bitcoin-cli --version
          '
